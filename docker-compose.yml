# 单机前后端：docker compose up -d --build
# 后端需能连上 MySQL / Redis：在下方 environment 填写，或使用 env_file: .env
services:
  prodigal-travel:
    build:
      context: ./
      dockerfile: ./prodigal-travel/Dockerfile
    container_name: prodigal-travel
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      AMAP_MAPS_API_KEY: ${PRODIGAL_AMAP_API_KEY}

  prodigal-web:
    build:
      context: ./
      dockerfile: ./prodigal-travel-web/Dockerfile
    container_name: prodigal-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - prodigal-travel

  # 测试用后端
  prodigal-travel-test:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/prodigal-travel:latest
    container_name: prodigal-travel-test
    ports:
      - "8089:8088" # 外部 8089 映射内部 8088
    networks:
      - travel-network

  # 测试用前端
  prodigal-web-test:
    image: ${ACR_REGISTRY}/${ACR_NAMESPACE}/prodigal-travel-web:latest
    container_name: prodigal-web-test
    ports:
      - "81:81" # 外部 8080 映射内部 80
    networks:
      - travel-network
