server {
  listen 80;
  server_name _;

  # 不暴露 nginx 精确版本
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;

  # --------------------------------------------------------------------------
  # 传输压缩：主包 710KB -> ~232KB，CSS 25KB -> ~6KB（gzip -6 实测）
  # gzip_types 必须显式包含 JS 的两种 MIME，nginx 默认只压缩 text/html
  # --------------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_proxied any;
  gzip_disable "MSIE [1-6]\.";
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/wasm
    image/svg+xml;

  # 基础安全响应头（子 location 中带 add_header 时不会继承，需各自重复）
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # 启用 HTTPS 后再打开：
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # 根路径在服务端直接跳转，省掉「加载主包 -> <Navigate to=/entry>」的
  # 一次客户端重定向（实测约 300ms）及其对根路由 chunk 的无用预加载。
  location = / {
    return 302 /entry;
  }

  # 带内容哈希的 JS/CSS：文件名随内容变化，可安全长期缓存
  location ~* ^/.+\.[a-f0-9]{8,}\.(?:async\.)?(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
  }

  # 不带哈希的静态资源：7 天，改动后靠文件名/版本区分
  location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    access_log off;
  }

  # SPA 回退；入口页永不缓存，否则会引用上一轮构建的旧 chunk 名
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }

  location /api/ {
    # 与 docker-compose.yml 的服务名保持一致；改名时两处必须同步，否则一键部署会 502
    proxy_pass http://travel-backend:8088/api/;

    # —— SSE 关键：长连接 + 不缓冲 + 不压缩 ——
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_set_header X-Accel-Buffering no;
    proxy_cache off;
    gzip off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
