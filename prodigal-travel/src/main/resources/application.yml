server:
  port: 8088
  servlet:
    context-path: /api
spring:
  application:
    name: prodigal-ai-travel
  profiles:
    # 不设环境变量时默认使用 local，避免 IDE 直接启动因缺少占位符失败
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      # 兼容 SPRING_DATA_REDIS_* 与 REDIS_* 两套环境变量名
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      database: ${SPRING_DATA_REDIS_DATABASE:${REDIS_DATABASE:0}}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prodigal_ai_travel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          max-attempts: 3
        default-requeue-rejected: false  # 拒绝后不重回队列

  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: ${MINIMAX_CHAT_MODEL:MiniMax-M2.7}
          temperature: 0.7
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.6-plus}
          temperature: 0.7
          # 部分 Qwen3 模型要求 enable_thinking 为 true，否则 HTTP 400
          enable-thinking: ${DASHSCOPE_ENABLE_THINKING:true}
      # RAG 向量入库需要 Embedding（与 chat 共用 api-key）
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
    # MCP 客户端：具体连接见 application-{profile}.yml / mcp-servers*.json
    mcp:
      client:
        enabled: ${SPRING_AI_MCP_CLIENT_ENABLED:true}
        name: travel-mcp-client
        version: 1.0
        request-timeout: ${SPRING_AI_MCP_CLIENT_REQUEST_TIMEOUT:180000}
        # 各 profile 自行配置 stdio.connections 或 stdio.servers-configuration，
        # 避免在公共配置里写死连接导致多环境互相覆盖

  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# mybatis plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产建议关闭 SQL 控制台输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.prodigal.travel.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# === PostgreSQL 向量库（RAG，可选） ===
pgvector:
  datasource:
    url: ${POSTGRESQL_URL:jdbc:postgresql://${POSTGRESQL_HOST:localhost}:5432/vector_db}
    username: ${POSTGRESQL_USERNAME:postgres}
    password: ${POSTGRESQL_PASSWORD:}
    driver-class-name: org.postgresql.Driver

prodigal:
  # Agent 专用线程池（与 Web 请求线程池隔离）
  agent:
    pool-size: ${PRODIGAL_AGENT_POOL_SIZE:6}
    queue-capacity: ${PRODIGAL_AGENT_QUEUE_CAPACITY:48}
  # RAG 严格知识库模式（只允许依据 pgvector 检索结果作答）
  rag:
    # COSINE 相似度下限，取值 0~1；越高越严格，出现误拒答时可适当调低
    similarity-threshold: ${PRODIGAL_RAG_SIMILARITY_THRESHOLD:0.65}
    top-k: ${PRODIGAL_RAG_TOP_K:5}
    # 主题词校验，拦截「问拉萨、召回黄山」这类跑题片段
    keyword-guard: ${PRODIGAL_RAG_KEYWORD_GUARD:true}
  jwt:
    secret: ${PRODIGAL_JWT_SECRET:prodigal-travel-default-jwt-secret-min-32-chars-long!!}
    expire-hours: ${PRODIGAL_JWT_EXPIRE_HOURS:10}
  auth:
    register:
      code-ttl-minutes: 5
      send-interval-seconds: 60
  # searchApi https://www.searchapi.io/
  search-api:
    api-key: ${PRODIGAL_SEARCH_API_API_KEY:}
  # 高德开放平台 Web 服务 API Key
  amap:
    api-key: ${PRODIGAL_AMAP_API_KEY:}
    host: https://restapi.amap.com/
  pexels:
    api-key: ${PRODIGAL_PEXELS_API_KEY:}
  baidu:
    app-id: ${PRODIGAL_BAIDU_APP_ID:}
    api-key: ${PRODIGAL_BAIDU_API_KEY:}
  ai:
    alert:
      enabled: ${PRODIGAL_AI_ALERT_ENABLED:${AI_ALERT_ENABLED:false}}
      recipients: ${PRODIGAL_AI_ALERT_RECIPIENTS:${AI_ALERT_RECIPIENTS:}}
      cooldown-minutes: ${PRODIGAL_AI_ALERT_COOLDOWN_MINUTES:${AI_ALERT_COOLDOWN_MINUTES:30}}

# springdoc-openapi
# http://localhost:port/api/doc.html
springdoc:
  swagger-u1:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    group: 'default'
    paths-to-match: '/**'
    packages-to-scan: com.prodigal.travel.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: "Prodigal AI Travel 接口文档"
    version: v1.0
    description: "Prodigal AI 旅游助手接口文档"
    concat: Lang
    group:
      default:
        group-name: "local"
        api-rule: package
        api-rule-resources:
          - com.prodigal.travel.controller
