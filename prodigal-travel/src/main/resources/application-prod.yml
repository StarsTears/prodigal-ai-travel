server:
  port: 8088
  servlet:
    context-path: /api
spring:
  application:
    name: prodigal-ai-travel
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:3306/prodigal_ai_travel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&sslMode=VERIFY_CA&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  # 注册成功欢迎邮件依赖消息队列；本地无 Rabbit 时可设 enabled: false
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:true}
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          max-attempts: 3
        default-requeue-rejected: false  # 关键：拒绝后不重回队列
  ai:
    minimax:
      api-key: ${MINIMAX_API_KEY:}
      chat:
        options:
          model: ${MINIMAX_CHAT_MODEL:MiniMax-M2.7}
          temperature: 0.7
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen3.6-plus}
          temperature: 0.7
          enable-thinking: ${DASHSCOPE_ENABLE_THINKING:true}
          multi-model: true
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        enabled: ${SPRING_AI_MCP_CLIENT_ENABLED:true}
        name: travel-mcp-client
        version: 1.0
        request-timeout: ${SPRING_AI_MCP_CLIENT_REQUEST_TIMEOUT:180000}
        stdio:
          servers-configuration: classpath:mcp-servers.json
  #        sse:
#          connections:
#            url: http://localhost:8090

  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:XXX@qq.com}
    password: ${SPRING_MAIL_PASSWORD:XXX}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# === 新增：PostgreSQL 向量库连接 ===
pgvector:
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST:localhost}:5432/vector_db
    username: ${POSTGRESQL_USERNAME:postgres}
    password: ${POSTGRESQL_PASSWORD:}
    driver-class-name: org.postgresql.Driver

# mybatis plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.prodigal.travel.model.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

prodigal:
  # Agent 专用线程池（与 Web 请求线程池隔离）
  agent:
    pool-size: ${PRODIGAL_AGENT_POOL_SIZE:6}
    queue-capacity: ${PRODIGAL_AGENT_QUEUE_CAPACITY:48}
  # RAG 严格知识库模式（只允许依据 pgvector 检索结果作答）
  rag:
    # COSINE 相似度下限，取值 0~1；仅用于应用层过滤，不下推到 SQL（过高会导致 SQL 零召回）
    similarity-threshold: ${PRODIGAL_RAG_SIMILARITY_THRESHOLD:0.35}
    top-k: ${PRODIGAL_RAG_TOP_K:5}
    # 主题词校验，拦截「问拉萨、召回黄山」这类跑题片段
    keyword-guard: ${PRODIGAL_RAG_KEYWORD_GUARD:true}
    # LLM 多查询扩展：把原查询改写成若干语义变体扩大向量召回面；每次 RAG 额外调用模型，成本较高
    llm-expansion-enabled: ${PRODIGAL_RAG_LLM_EXPANSION:true}
    # 地理标签确定性召回：识别查询里的行政区，按 province/city 标签直接取数，可靠修复「搜海南召回不了三亚」
    geo-enabled: ${PRODIGAL_RAG_GEO_ENABLED:true}
  jwt:
    secret: ${PRODIGAL_JWT_SECRET:prodigal-travel-default-jwt-secret}
    expire-hours: 24
  auth:
    register:
      code-ttl-minutes: 5
      send-interval-seconds: 60
  # searchApi https://www.searchapi.io/
  search-api:
    api-key: ${PRODIGAL_SEARCH_API_API_KEY:}
  # 高德开放平台 Web 服务 API Key
  amap:
    api-key: ${PRODIGAL_AMAP_API_KEY:}
    host: https://restapi.amap.com/  # 高德 API 地址
  pexels:
    api-key: ${PRODIGAL_PEXELS_API_KEY:}
  baidu:
    app-id: ${PRODIGAL_BAIDU_APP_ID:}
    api-key: ${PRODIGAL_BAIDU_API_KEY:}
  ai:
    alert:
      enabled: ${PRODIGAL_AI_ALERT_ENABLED:false}}
      # 多个接收人用英文逗号分隔；例如：a@xx.com,b@xx.com
      recipients: ${PRODIGAL_AI_ALERT_RECIPIENTS:}
      # 同一错误的最小告警间隔，避免刷屏
      cooldown-minutes: ${PRODIGAL_AI_ALERT_COOLDOWN_MINUTES::30}


# springdoc-openapi
# http://localhost:port/api/doc.html
springdoc:
  swagger-u1:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    group: 'AI'
    paths-to-match: '/**'
    packages-to-scan: com.prodigal.travel.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: "Prodigal AI Travel 接口文档"
    version: v1.0
    description: "Prodigal AI 旅游助手接口文档"
    concat: Lang
    group:
      default:
        group-name: "local"
        api-rule: package
        api-rule-resources:
          - com.prodigal.travel.controller
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug